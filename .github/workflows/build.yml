name: Build Sniper 3D APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          if [ -f Sniper3D-25MB.zip ]; then
            echo "Extracting zip..."
            unzip -o Sniper3D-25MB.zip -d project
            shopt -s dotglob
            mv project/* . 2>/dev/null || true
            rm -rf project Sniper3D-25MB.zip
            ls -la
          else
            echo "No zip, using existing files"
            ls -la
          fi
          test -f project.godot && echo "project.godot OK" || (echo "ERROR: no project.godot"; exit 1)

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/23.2.8568313" >> $GITHUB_ENV

      - name: Download Godot 4.3
        run: |
          mkdir -p $HOME/godot-bin
          cd $HOME/godot-bin
          curl -fL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          mv Godot_v4.3-stable_linux.x86_64 godot
          ./godot --version

      - name: Download Export Templates
        run: |
          mkdir -p $HOME/.local/share/godot/export_templates/4.3.stable
          cd /tmp
          curl -fL -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          unzip -q templates.tpz
          if [ -d templates ]; then
            cp -r templates/* $HOME/.local/share/godot/export_templates/4.3.stable/
          fi
          ls -la $HOME/.local/share/godot/export_templates/4.3.stable/ | head -10

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Sniper3D,OU=Dev,O=Sniper3D,L=Jakarta,ST=Jakarta,C=ID" -noprompt

      - name: Write export_presets.cfg
        run: |
          cat > export_presets.cfg << 'PRESET'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/Sniper3D.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          keystore/debug="debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          version/code=1
          version/name="1.0.0"
          package/unique_name="com.sniper3d.game"
          package/name="Sniper 3D"
          package/signed=true
          package/app_category=2
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          permissions/vibrate=true
          PRESET

      - name: Create build dir
        run: mkdir -p build

      - name: Validate project
        run: |
          $HOME/godot-bin/godot --headless --path . --quit-after 3 2>&1 | tee validate.log || true
          cat validate.log

      - name: Export Android APK
        run: |
          set -o pipefail
          $HOME/godot-bin/godot --headless --path . --export-debug "Android" build/Sniper3D.apk 2>&1 | tee export.log
          if [ -f build/Sniper3D.apk ]; then
            ls -lh build/Sniper3D.apk
            echo "APK OK"
          else
            echo "APK FAILED"
            cat export.log
            cat validate.log || true
            ls -la
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sniper3D-APK
          path: build/Sniper3D.apk
          retention-days: 30

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            export.log
            validate.log
          if-no-files-found: ignore
