name: Build Sniper 3D APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3-stable"
  GODOT_VERSION_SHORT: "4.3"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/23.2.8568313" >> $GITHUB_ENV

      - name: Cache Godot + templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            \~/godot-bin
            \~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-templates-v2

      - name: Download Godot 4.3
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p \~/godot-bin
          cd \~/godot-bin
          curl -fL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/\( {GODOT_VERSION}/Godot_v \){GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          mv Godot_v${GODOT_VERSION}_linux.x86_64 godot
          ./godot --version

      - name: Download Export Templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p \~/.local/share/godot/export_templates/${GODOT_VERSION_SHORT}.stable
          cd /tmp
          curl -fL -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/\( {GODOT_VERSION}/Godot_v \){GODOT_VERSION}_export_templates.tpz"
          unzip -q templates.tpz
          if [ -d templates ]; then
            cp -r templates/* \~/.local/share/godot/export_templates/${GODOT_VERSION_SHORT}.stable/
          fi
          ln -sfn \( {GODOT_VERSION_SHORT}.stable \~/.local/share/godot/export_templates/ \){GODOT_VERSION}.stable || true
          ls -la \~/.local/share/godot/export_templates/
          ls -la \~/.local/share/godot/export_templates/${GODOT_VERSION_SHORT}.stable/ | head -20

      - name: Add Godot to PATH
        run: |
          echo "$HOME/godot-bin" >> $GITHUB_PATH
          $HOME/godot-bin/godot --version || true

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Sniper3D Debug, OU=Dev, O=Sniper3D, L=Jakarta, ST=Jakarta, C=ID" \
            -noprompt

      - name: Write export_presets.cfg
        run: |
          cat > export_presets.cfg << 'PRESET'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/Sniper3D.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          keystore/debug="debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          version/code=1
          version/name="1.0.0"
          package/unique_name="com.sniper3d.game"
          package/name="Sniper 3D"
          package/signed=true
          package/app_category=2
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          permissions/vibrate=true
          PRESET

      - name: Create build dir
        run: mkdir -p build

      - name: Validate project (headless)
        run: |
          $HOME/godot-bin/godot --headless --path . --quit-after 3 2>&1 | tee validate.log || true
          echo "---- validate.log ----"
          cat validate.log

      - name: Export Android APK
        id: export
        run: |
          set -o pipefail
          $HOME/godot-bin/godot --headless --path . --export-debug "Android" build/Sniper3D.apk 2>&1 | tee export.log
          EXPORT_EXIT=${PIPESTATUS[0]}
          echo "Godot export exit code: $EXPORT_EXIT"
          
          if [ -f build/Sniper3D.apk ]; then
            echo "APK_OK=true" >> $GITHUB_ENV
            ls -lh build/Sniper3D.apk
            echo "✅ APK generated successfully"
          else
            echo "APK_OK=false" >> $GITHUB_ENV
            echo "❌ APK was NOT generated"
            echo "==== FULL EXPORT LOG ===="
            cat export.log
            echo "==== VALIDATE LOG ===="
            cat validate.log || true
            echo "==== PROJECT FILES ===="
            ls -la
            ls -la scenes/main/ || true
            exit 1
          fi

      - name: Upload APK (success)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sniper3D-APK
          path: build/Sniper3D.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload debug logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            export.log
            validate.log
          retention-days: 14
          if-no-files-found: ignore
