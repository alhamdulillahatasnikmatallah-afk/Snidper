name: Build Sniper 3D APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          if [ -f Sniper3D-25MB.zip ]; then
            unzip -o Sniper3D-25MB.zip -d project
            shopt -s dotglob
            mv project/* . 2>/dev/null || true
            rm -rf project Sniper3D-25MB.zip
          fi
          ls -la
          test -f project.godot || (echo "no project.godot"; exit 1)

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd /tmp
          curl -fL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          mv cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "$HOME/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Download Godot 4.3
        run: |
          mkdir -p $HOME/godot-bin
          cd $HOME/godot-bin
          curl -fL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          mv Godot_v4.3-stable_linux.x86_64 godot
          ./godot --version

      - name: Download Export Templates
        run: |
          mkdir -p $HOME/.local/share/godot/export_templates/4.3.stable
          cd /tmp
          curl -fL -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          unzip -q templates.tpz
          cp -r templates/* $HOME/.local/share/godot/export_templates/4.3.stable/
          ls $HOME/.local/share/godot/export_templates/4.3.stable/ | head -8

      - name: Create keystore
        run: |
          keytool -genkeypair -v -keystore $GITHUB_WORKSPACE/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          ls -la $GITHUB_WORKSPACE/debug.keystore

      - name: Write export_presets.cfg
        run: |
          cat > export_presets.cfg << PRESET
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/Sniper3D.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          keystore/debug="$GITHUB_WORKSPACE/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          version/code=2
          version/name="1.0.1"
          package/unique_name="com.sniper3d.game"
          package/name="Sniper 3D"
          package/signed=true
          package/app_category=2
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          permissions/vibrate=true
          PRESET

      - name: Create build dir
        run: mkdir -p build

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -o pipefail
          $HOME/godot-bin/godot --headless --path . --export-debug "Android" build/Sniper3D.apk 2>&1 | tee export.log
          ls -lh build/ || true
          if [ ! -f build/Sniper3D.apk ]; then
            echo "APK missing"
            cat export.log
            exit 1
          fi
          SIZE=$(stat -c%s build/Sniper3D.apk)
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "APK too small, likely broken"
            cat export.log
            exit 1
          fi
          # Verify zip structure of apk
          unzip -t build/Sniper3D.apk | tail -5
          echo "APK OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sniper3D-APK
          path: build/Sniper3D.apk
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: export.log
          if-no-files-found: ignore
